name: Probe AMC portfolio files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python pipeline/probe_portfolios.py
      - name: Commit
        run: |
          git config user.name "fund-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw/holdings_probe.json
          git diff --cached --quiet || (git commit -m "Holdings probe $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
