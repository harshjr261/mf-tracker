name: Weekly news refresh
on:
  schedule:
    - cron: "30 2 * * 0"   # Sunday 08:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Fetch AMC and fund-manager headlines (last 12 months)
        run: python pipeline/fetch_news.py
      - name: Commit
        run: |
          git config user.name "fund-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/news.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "News refresh $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
